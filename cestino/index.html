<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head><body>
<title>Cestino della Tuscia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Un cestino di vimini su un prato: in alto mosse e obiettivo grandi, al centro la griglia 7x7, sotto due soli bottoni.
   Pensato per chi ha 60 anni e più: caselle grandi, testo grande, niente tempo che scorre, un aiuto se ti fermi. Tema unico, voluto. */
:root{
  --prato:#24452f; --prato2:#1b3524; --vimini:#c99a5b; --vimini2:#a87a40; --cella:#f3e3c3; --cella2:#e8d2a6;
  --testo:#fff8ea; --scuro:#2a1d10; --oro:#f5c542; --rosso:#d9573b;
  --f-titolo:"Fredoka","Trebuchet MS",system-ui,sans-serif; --f-testo:"Atkinson Hyperlegible","Verdana",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,var(--prato) 0%,var(--prato2) 100%);color:var(--testo);font:400 19px/1.4 var(--f-testo);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.app{height:100%;display:flex;flex-direction:column;align-items:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 14px;box-sizing:border-box}
button{font-family:var(--f-titolo);cursor:pointer;border:0}
button:focus-visible{outline:4px solid var(--oro);outline-offset:3px}

/* barra in alto */
.barra{width:min(100%,520px);display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:stretch}
.box{background:rgba(0,0,0,.28);border-radius:16px;padding:8px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:76px}
.box small{font:700 13px var(--f-testo);letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.box b{font:700 32px/1 var(--f-titolo);font-variant-numeric:tabular-nums}
.box.poche b{color:#ffb4a0}
.obiettivi{flex-direction:row;gap:14px;flex-wrap:wrap}
.ob{display:flex;align-items:center;gap:6px;font:700 24px var(--f-titolo);font-variant-numeric:tabular-nums}
.ob svg{width:38px;height:38px}
.ob.fatto{color:#a8e6a0}
.paese{font:600 20px var(--f-titolo);text-align:center;margin:0;line-height:1.1;text-wrap:balance}
.paese span{display:block;font:400 15px var(--f-testo);opacity:.8;margin-top:2px}

/* il cestino */
.cesto{position:relative;width:var(--lato);height:var(--lato);padding:10px;border-radius:22px;background:repeating-linear-gradient(45deg,var(--vimini) 0 9px,var(--vimini2) 9px 18px);box-shadow:0 10px 0 #7a5228,0 18px 30px rgba(0,0,0,.35);box-sizing:content-box}
.griglia{position:absolute;inset:10px;border-radius:14px;overflow:hidden;background:var(--cella2)}
.casa{position:absolute;width:var(--c);height:var(--c);box-sizing:border-box;border:1px solid rgba(120,80,30,.12)}
.casa.chiara{background:var(--cella)}
.pezzo{position:absolute;left:0;top:0;width:var(--c);height:var(--c);display:flex;align-items:center;justify-content:center;transition:transform .2s ease-in;will-change:transform}
.pezzo svg{width:84%;height:84%;transition:transform .18s ease;filter:drop-shadow(0 2px 1px rgba(0,0,0,.25))}
.pezzo.scelto svg{transform:scale(1.15)}
.pezzo.scelto::before{content:"";position:absolute;inset:3px;border-radius:12px;border:4px solid var(--rosso)}
.pezzo.via svg{transform:scale(0);transition:transform .22s ease-in}
.pezzo.aiuto svg{animation:aiuto 1s ease-in-out infinite}
@keyframes aiuto{50%{transform:scale(1.22) rotate(-6deg)}}
.pezzo .spec{position:absolute;inset:6%;border-radius:12px;pointer-events:none}
.pezzo .spec.h{background:linear-gradient(transparent 42%,rgba(255,255,255,.85) 42% 58%,transparent 58%)}
.pezzo .spec.v{background:linear-gradient(90deg,transparent 42%,rgba(255,255,255,.85) 42% 58%,transparent 58%)}
.lampo{position:absolute;pointer-events:none;background:rgba(255,246,200,.85);border-radius:10px;animation:lampo .35s ease-out forwards}
@keyframes lampo{from{opacity:1}to{opacity:0}}
.punti{position:absolute;pointer-events:none;font:700 26px var(--f-titolo);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5);animation:su .8s ease-out forwards}
@keyframes su{to{transform:translateY(-50px);opacity:0}}
@media (prefers-reduced-motion:reduce){.pezzo,.pezzo svg{transition-duration:.05s}.pezzo.aiuto svg{animation:none;outline:4px solid var(--oro)}}

/* sotto */
.sotto{display:flex;gap:12px;width:min(100%,520px)}
.sotto button{flex:1;min-height:56px;border-radius:16px;font-size:18px;padding:0 6px;font-weight:600;background:rgba(0,0,0,.3);color:var(--testo)}
.consiglio{min-height:28px;font-size:18px;text-align:center;opacity:.95;margin:0}

/* schermate (mappa, fine livello) */
.velo{position:fixed;inset:0;z-index:20;background:rgba(15,28,19,.82);display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.carta{width:min(100%,460px);max-height:100%;overflow:auto;background:#fbf3e2;color:var(--scuro);border-radius:24px;padding:22px;box-sizing:border-box;box-shadow:0 20px 50px rgba(0,0,0,.45);text-align:center}
.carta h2{font:700 30px/1.15 var(--f-titolo);margin:0 0 6px;text-wrap:balance}
.carta p{margin:8px 0;font-size:19px}
.carta .fatto-vero{background:#efe1c2;border-radius:16px;padding:12px 14px;text-align:left;font-size:18px;margin:14px 0}
.carta .fatto-vero b{font-family:var(--f-titolo)}
.stelle{font-size:46px;letter-spacing:6px;margin:4px 0;color:var(--oro);text-shadow:0 2px 0 #a8801c}
.stelle .spenta{color:#d8c9a8;text-shadow:none}
.grande{display:block;width:100%;min-height:62px;border-radius:18px;background:var(--rosso);color:#fff;font-size:24px;font-weight:600;margin-top:12px;box-shadow:0 5px 0 #9c3a24}
.grande:active{transform:translateY(3px);box-shadow:0 2px 0 #9c3a24}
.piccolo{display:block;width:100%;min-height:52px;border-radius:16px;background:transparent;color:var(--scuro);font-size:19px;margin-top:8px;border:2px solid #cdb68b}
.livelli{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.livello{min-height:74px;border-radius:16px;background:#efe1c2;color:var(--scuro);font:600 18px/1.15 var(--f-titolo);padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.livello small{font:400 15px var(--f-testo);color:#7a5a32}
.livello .st{color:#c9971c;font-size:16px;letter-spacing:2px}
.livello[disabled]{opacity:.45;cursor:default}
.livello.prossimo{background:var(--oro);box-shadow:0 4px 0 #b38b1f}
.intro-pezzi{display:flex;justify-content:center;gap:6px;margin:10px 0}
.intro-pezzi svg{width:44px;height:44px}
</style>

<div class="app" id="app">
  <div class="barra">
    <div class="box" id="boxMosse"><small>Mosse</small><b id="mosse">20</b></div>
    <div class="box obiettivi" id="obiettivi" aria-label="Obiettivo"></div>
    <div class="box"><small>Punti</small><b id="punti" style="font-size:24px">0</b></div>
  </div>
  <p class="paese" id="paese">Fabrica di Roma<span>raccogli le nocciole</span></p>
  <div class="cesto" id="cesto"><div class="griglia" id="griglia"></div></div>
  <p class="consiglio" id="consiglio">Scambia due vicini per metterne 3 in fila</p>
  <div class="sotto">
    <button type="button" id="bMappa">🗺️ Paesi</button>
    <button type="button" id="bGiorno">📅 Del giorno</button>
    <button type="button" id="bRifai">↻ Rifai</button>
  </div>
</div>

<div class="velo" id="velo" hidden><div class="carta" id="carta"></div></div>

<script>
(function(){
'use strict';
/* ------------------------------------------------------------------ nocciola, castagna, fungo, oliva: forme e colori ben diversi */
const PEZZI = {
  nocciola: { nome:'nocciole', svg:'<svg viewBox="0 0 64 64"><ellipse cx="32" cy="38" rx="21" ry="20" fill="#a0612c"/><ellipse cx="25" cy="34" rx="6" ry="8" fill="#c98a4f" opacity=".7"/><path d="M10 27c4-15 40-15 44 0-6-5-12 3-22-2-10 5-16-3-22 2z" fill="#6aa83a"/><path d="M32 7v8" stroke="#4d6b26" stroke-width="4" stroke-linecap="round"/></svg>' },
  castagna: { nome:'castagne', svg:'<svg viewBox="0 0 64 64"><path d="M32 6C19 18 9 30 10 42c1 10 10 16 22 16s21-6 22-16C55 30 45 18 32 6z" fill="#4a210f"/><path d="M12 45c6 6 34 6 40 0-1 9-9 13-20 13S13 54 12 45z" fill="#e2c49a"/><path d="M24 21c-3 5-5 10-5 15" stroke="#8a4a2a" stroke-width="4" stroke-linecap="round" fill="none"/></svg>' },
  fungo:    { nome:'funghi porcini', svg:'<svg viewBox="0 0 64 64"><path d="M23 33h18l4 21c0 5-26 5-26 0z" fill="#fbf2dc" stroke="#d8c7a0" stroke-width="2"/><path d="M6 34C6 17 18 7 32 7s26 10 26 27c-7 5-45 5-52 0z" fill="#c0612a"/><path d="M15 21c4-6 10-9 17-9" stroke="#e39a62" stroke-width="4" stroke-linecap="round" fill="none"/></svg>' },
  oliva:    { nome:'olive', svg:'<svg viewBox="0 0 64 64"><path d="M38 8c9-3 17 1 19 7-7 3-14 0-19-7z" fill="#4f8a2a"/><ellipse cx="30" cy="38" rx="16" ry="21" transform="rotate(-25 30 38)" fill="#6f8d1a"/><ellipse cx="24" cy="31" rx="4.5" ry="8" transform="rotate(-25 24 31)" fill="#cddc72" opacity=".85"/><path d="M38 20l5-9" stroke="#56661a" stroke-width="3" stroke-linecap="round"/></svg>' },
  jolly:    { nome:'cestino magico', svg:'<svg viewBox="0 0 64 64"><path d="M12 28h40l-5 26H17z" fill="#b8843f"/><path d="M12 28h40" stroke="#7a5228" stroke-width="5" stroke-linecap="round"/><path d="M20 28c0-12 24-12 24 0" stroke="#7a5228" stroke-width="5" fill="none"/><path d="M32 6l3 7 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z" fill="#ffd84a" stroke="#c8961a" stroke-width="1.5"/><path d="M17 38h30M19 46h26" stroke="#d9a861" stroke-width="3"/></svg>' }
};
const TIPI = ['nocciola','castagna','fungo','oliva'];

/* ------------------------------------------------------------------ i paesi (livelli): cose vere della Tuscia, frasi brevi */
// zona → cosa si raccoglie (in ordine d'importanza)
const ZONE = {
  falisco: ['nocciola', 'oliva', 'fungo'],     // Agro Falisco
  cimini:  ['nocciola', 'castagna', 'fungo'],  // Monti Cimini e Lago di Vico
  teverina:['oliva', 'fungo', 'castagna'],     // Viterbo e valle del Tevere
  bolsena: ['fungo', 'oliva', 'castagna'],     // Lago di Bolsena e Alta Tuscia
  maremma: ['oliva', 'fungo', 'nocciola']      // Maremma e Tuscia del sud-ovest
};
// i 60 paesi della provincia di Viterbo, uno per livello: [paese, zona, lo sapevi]
const PAESI_TUSCIA = [
  ['Fabrica di Roma','falisco','Nelle campagne di Fabrica c\'è Falerii Novi, una città romana con le mura ancora in piedi.'],
  ['Carbognano','cimini','Carbognano è il paese delle nocciole: qui cresce la Tonda Gentile Romana, oggi Nocciola Romana DOP.'],
  ['Vallerano','cimini','La Castagna di Vallerano ha il marchio DOP: si raccoglie sui Monti Cimini in autunno.'],
  ['Caprarola','cimini','A Caprarola c\'è Palazzo Farnese, con la pianta a cinque lati e la grande scala a chiocciola.'],
  ['Ronciglione','cimini','Ronciglione è famoso per il Carnevale e per le corse a vuoto, i cavalli che corrono senza fantino.'],
  ['Corchiano','falisco','Corchiano è circondato da forre e boschi; vicino passa la Via Amerina, con le sue tagliate nel tufo.'],
  ['Civita Castellana','falisco','Civita Castellana è la città della ceramica: le sue fabbriche lavorano da più di un secolo.'],
  ['Faleria','falisco','Faleria guarda la valle del Treja dall\'alto del suo castello.'],
  ['Calcata','falisco','Calcata è un borgo arroccato su una rupe sopra la valle del Treja, amato da artisti e pittori.'],
  ['Castel Sant\'Elia','falisco','Nella valle sotto il paese c\'è la Basilica di Sant\'Elia, con affreschi di quasi mille anni fa.'],
  ['Nepi','falisco','Nepi è la città delle acque: famosa per la sua acqua minerale e per il Forte dei Borgia.'],
  ['Monterosi','falisco','Monterosi sta sulla Via Cassia, accanto a un piccolo lago nato da un vulcano.'],
  ['Sutri','maremma','Sutri ha un anfiteatro romano scavato tutto nel tufo.'],
  ['Capranica','maremma','Capranica sta sulla Via Francigena, la strada dei pellegrini diretti a Roma.'],
  ['Bassano Romano','maremma','A Bassano Romano c\'è Palazzo Giustiniani, con sale affrescate nel Seicento.'],
  ['Oriolo Romano','maremma','Oriolo fu costruito nel Cinquecento con le strade dritte; in piazza c\'è Palazzo Altieri.'],
  ['Vejano','maremma','Vejano sta su uno sperone di tufo, dominato dal suo castello.'],
  ['Barbarano Romano','maremma','Vicino a Barbarano c\'è il parco di Marturanum, con tombe etrusche scavate nella roccia.'],
  ['Blera','maremma','Blera è un paese sul tufo: lungo le forre ci sono necropoli etrusche.'],
  ['Villa San Giovanni in Tuscia','maremma','Villa San Giovanni è un piccolo paese tra boschi e campi, vicino a Blera.'],
  ['Vetralla','maremma','Intorno a Vetralla gli ulivi danno l\'olio extravergine della Tuscia, che ha la DOP.'],
  ['Viterbo','teverina','Ogni 3 settembre a Viterbo cento uomini portano a spalla la Macchina di Santa Rosa, alta circa 30 metri.'],
  ['Vitorchiano','teverina','A Vitorchiano c\'è un Moai, scolpito nel peperino da artigiani venuti dall\'Isola di Pasqua.'],
  ['Soriano nel Cimino','cimini','A Soriano, in ottobre, c\'è la Sagra delle Castagne, sotto il Castello Orsini.'],
  ['Canepina','cimini','Canepina è famosa per il fieno: una pasta all\'uovo sottilissima, tagliata a mano.'],
  ['Vignanello','cimini','Vignanello ha un vino DOC con il suo nome e il Castello Ruspoli con il giardino all\'italiana.'],
  ['Vasanello','falisco','Vasanello ha una lunga tradizione di ceramica e il Castello Orsini.'],
  ['Gallese','falisco','Gallese è un borgo sul tufo vicino al Tevere, con il suo Palazzo Ducale.'],
  ['Orte','teverina','Sotto Orte c\'è Orte Sotterranea: cunicoli, cisterne e colombari scavati nel tufo.'],
  ['Bassano in Teverina','teverina','Bassano in Teverina è un borgo medievale affacciato sulla valle del Tevere.'],
  ['Bomarzo','cimini','A Bomarzo c\'è il Sacro Bosco, il Parco dei Mostri: statue giganti scolpite nella roccia nel Cinquecento.'],
  ['Graffignano','teverina','A Graffignano il Castello Baglioni domina la valle del Tevere.'],
  ['Civitella d\'Agliano','teverina','Civitella d\'Agliano è un borgo sulla valle del Tevere, con i resti del suo castello.'],
  ['Castiglione in Teverina','teverina','Castiglione in Teverina è terra di vino: c\'è anche un museo del vino, il MUVIS.'],
  ['Celleno','teverina','Il borgo vecchio di Celleno, abbandonato per anni, era chiamato «il borgo fantasma».'],
  ['Bagnoregio','teverina','Da Bagnoregio si arriva a piedi a Civita, «la città che muore», su un ponte lungo e stretto.'],
  ['Lubriano','teverina','Da Lubriano si vede Civita di Bagnoregio come da un balcone.'],
  ['Montefiascone','bolsena','Montefiascone è la patria del vino Est! Est!! Est!!! e guarda il Lago di Bolsena dalla Rocca dei Papi.'],
  ['Marta','bolsena','A Marta il fiume Marta esce dal Lago di Bolsena; a maggio c\'è la festa della Barabbata.'],
  ['Capodimonte','bolsena','Capodimonte sta su un promontorio del Lago di Bolsena, davanti all\'isola Bisentina.'],
  ['Bolsena','bolsena','Il Lago di Bolsena è il più grande lago vulcanico d\'Europa.'],
  ['San Lorenzo Nuovo','bolsena','San Lorenzo Nuovo fu ricostruito nel Settecento attorno a una piazza a otto lati.'],
  ['Grotte di Castro','bolsena','Grotte di Castro sta sopra il Lago di Bolsena, tra campi di patate e di lenticchie.'],
  ['Gradoli','bolsena','A Gradoli si fa l\'Aleatico, un vino dolce rosso che ha la DOC.'],
  ['Onano','bolsena','A Onano si coltiva la Lenticchia di Onano, piccola e saporita.'],
  ['Acquapendente','bolsena','Ad Acquapendente, a maggio, la Festa dei Pugnaloni riempie il paese di grandi quadri fatti di fiori.'],
  ['Proceno','bolsena','Proceno è l\'ultimo paese prima della Toscana, con il suo castello medievale.'],
  ['Latera','bolsena','Vicino a Latera c\'è il Lago di Mezzano, un piccolo lago nato da un vulcano.'],
  ['Valentano','bolsena','Dalla Rocca Farnese di Valentano si vede tutto il Lago di Bolsena.'],
  ['Piansano','bolsena','Piansano è un paese di campagna sull\'altopiano tra il Lago di Bolsena e la Maremma.'],
  ['Ischia di Castro','maremma','Vicino a Ischia di Castro ci sono le rovine di Castro, la città distrutta nel 1649.'],
  ['Farnese','maremma','Da Farnese prende il nome la famiglia Farnese; vicino c\'è il bosco della Selva del Lamone.'],
  ['Cellere','maremma','A Cellere c\'è la chiesa di Sant\'Egidio, attribuita ad Antonio da Sangallo.'],
  ['Canino','maremma','Canino è terra d\'olio: il suo olio extravergine ha la DOP.'],
  ['Tessennano','maremma','Tessennano è uno dei paesi più piccoli della Tuscia, in mezzo agli ulivi.'],
  ['Arlena di Castro','maremma','Arlena di Castro è un piccolo paese della Maremma viterbese, tra grano e ulivi.'],
  ['Tuscania','maremma','A Tuscania le chiese di San Pietro e di Santa Maria Maggiore sono capolavori del romanico.'],
  ['Monte Romano','maremma','Monte Romano sta tra i pascoli della Maremma, terra di butteri e cavalli.'],
  ['Tarquinia','maremma','Le tombe etrusche dipinte di Tarquinia sono patrimonio dell\'UNESCO.'],
  ['Montalto di Castro','maremma','A Montalto c\'è Vulci, una grande città etrusca, e il mare della Tuscia.']
];
// livelli che crescono piano: più raccolto e un po' più di mosse, uno, due o tre frutti da raccogliere
const LIVELLI = PAESI_TUSCIA.map(([paese, zona, fatto], i) => {
  const quanti = i < 10 ? 1 : i < 40 ? 2 : 3, tipi = ZONE[zona].slice(0, quanti), tot = 15 + Math.round(i * 1.1);
  const ob = {}; tipi.forEach((t, k) => { ob[t] = Math.max(8, Math.round(tot * (quanti === 1 ? 1 : k === 0 ? .55 : (1 - .55) / (quanti - 1)))); });
  return { paese, tipi: 4, mosse: 20 + Math.min(10, Math.floor(i / 6)), ob, fatto };
});

/* ------------------------------------------------------------------ stato */
const N = 7;
const ls = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
let salvato = ls.get('cestino-tuscia') || { stelle:{}, attuale:0 };
let lv = 0, L = null, B = [], mosse = 0, punti = 0, resto = {}, occupato = false, scelto = null, timerAiuto = 0, lato = 0, C = 0;
const $ = id => document.getElementById(id);
const griglia = $('griglia'), cesto = $('cesto');
const attesa = ms => new Promise(r => setTimeout(r, ms));
const vibra = n => { try { navigator.vibrate && navigator.vibrate(n); } catch(e){} };

/* ------------------------------------------------------------------ suoni gentili (partono dopo il primo tocco) */
let ac = null;
function suono(f, d, v){ try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(v || .08, ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + (d || .15)); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + (d || .15)); } catch(e){} }

/* ------------------------------------------------------------------ misure: il cestino occupa tutto lo spazio libero */
function misura(){
  const app = $('app'), altri = [...app.children].filter(e => e !== cesto).reduce((a, e) => a + e.getBoundingClientRect().height, 0);
  const alto = app.clientHeight - altri - 12 * (app.children.length - 1) - 26 - 20;
  lato = Math.floor(Math.max(240, Math.min(app.clientWidth - 20, alto, 520)) / N) * N; C = lato / N;
  document.documentElement.style.setProperty('--lato', lato + 'px'); document.documentElement.style.setProperty('--c', C + 'px');
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const p = B[r] && B[r][c]; if (p) metti(p, r, c); }
  disegnaCase();
}
function disegnaCase(){ griglia.querySelectorAll('.casa').forEach(e => e.remove()); for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const d = document.createElement('div'); d.className = 'casa' + ((r + c) % 2 ? '' : ' chiara'); d.style.left = c * C + 'px'; d.style.top = r * C + 'px'; griglia.prepend(d); } }

/* ------------------------------------------------------------------ pezzi */
function nuovo(tipo, r, c, daRiga){
  const el = document.createElement('div'); el.className = 'pezzo';
  const p = { tipo, spec:null, el, r, c };
  disegnaPezzo(p); griglia.appendChild(el);
  el.style.transition = 'none'; el.style.transform = `translate(${c * C}px,${(daRiga == null ? r : daRiga) * C}px)`; el.offsetWidth; el.style.transition = '';
  el.addEventListener('pointerdown', e => giu(e, p));
